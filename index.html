<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Dodge the Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:      #151B27;
    --bg2:     #1B2333;
    --panel:   #1C2433;
    --ink:     #FDFDFD;
    --body:    #B4BECD;
    --muted:   #7C879C;
    --accent:  #EFDF74;
    --good:    #6FE3B4;
    --bad:     #FF7A65;
    --rule:    rgba(253,253,253,0.12);
    --f-display:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono:'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    background:var(--bg); color:var(--body); font-family:var(--f-display);
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }

  #wrap{ position:relative; height:100vh; height:100dvh; aspect-ratio:4/7; max-width:100vw; }
  @media (min-aspect-ratio:4/7){ #wrap{ height:100vh; height:100dvh; } }
  #game{ width:100%; height:100%; display:block; background:var(--bg); }

  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:28px; text-align:center; background:linear-gradient(180deg, rgba(10,14,20,0.62), rgba(10,14,20,0.8));
  }
  .overlay[hidden]{ display:none; }
  .brandmark{ display:flex; align-items:center; gap:8px; font-weight:700; color:var(--ink); font-size:14px; letter-spacing:.02em; }
  .brandmark .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .logo{ width:100%; max-width:320px; height:auto; }
  .sub{ font-size:14px; color:var(--muted); max-width:34ch; margin:0; }

  .themepick{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:300px; }
  .themebtn{
    all:unset; cursor:pointer; display:flex; flex-direction:column; gap:2px;
    padding:14px 16px; border:1.5px solid var(--rule); text-align:left; color:var(--body);
  }
  .themebtn b{ color:var(--ink); font-size:15px; }
  .themebtn span{ font-size:12.5px; }
  .themebtn.on{ border-color:var(--accent); background:rgba(239,223,116,0.08); }

  .charpick{ display:flex; gap:14px; }
  .charbtn{ all:unset; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 18px; border:1.5px solid var(--rule); color:var(--muted); font-size:12px; }
  .charbtn.on{ border-color:var(--accent); color:var(--ink); }
  .charbtn canvas{ width:44px; height:64px; }

  .go{
    all:unset; cursor:pointer; font-family:var(--f-mono); font-weight:700; font-size:15px;
    color:var(--bg); background:var(--accent); padding:14px 30px; letter-spacing:.02em;
  }
  .go:active{ transform:translateY(1px); }

  .go2{
    all:unset; cursor:pointer; font-family:var(--f-mono); font-weight:700; font-size:13px;
    color:var(--body); background:transparent; border:1.5px solid var(--rule); padding:12px 26px; letter-spacing:.02em;
  }
  .go2:active{ transform:translateY(1px); }

  .hud{ position:absolute; top:16px; left:16px; right:16px; display:flex; justify-content:space-between;
    font-family:var(--f-mono); font-size:13px; color:var(--ink); z-index:2; font-variant-numeric:tabular-nums; }
  .hud .best{ color:var(--muted); }

  .controls{ position:absolute; left:14px; right:14px; bottom:18px; display:flex; gap:10px; z-index:2; }
  .ctlbtn{ all:unset; flex:1; cursor:pointer; text-align:center; font-family:var(--f-mono); font-weight:700; font-size:14px;
    color:var(--ink); background:rgba(255,255,255,0.06); border:1px solid var(--rule); padding:16px 0; letter-spacing:.06em; }
  .ctlbtn:active{ background:rgba(239,223,116,0.16); border-color:var(--accent); }
  .ctlbtn .arrow{ display:block; font-size:18px; margin-bottom:2px; }

  .result-badge{ width:150px; height:150px; }
  .result-note{ font-size:13.5px; color:var(--body); max-width:32ch; }
  .result-score{ font-size:13px; color:var(--muted); font-family:var(--f-mono); }
  .result-score b{ color:var(--ink); }
  .cta{ font-size:13px; color:var(--accent); text-decoration:none; border-bottom:1px solid rgba(239,223,116,0.5); padding-bottom:1px; }
</style>
</head><body>

<div id="wrap">
  <canvas id="game" width="400" height="700"></canvas>

  <div class="hud" id="hud" hidden>
    <span id="scoreLive">0.0s</span>
    <span class="best" id="bestLive">best 0.0s</span>
  </div>

  <div class="controls" id="controls" hidden>
    <button class="ctlbtn" id="btnLeft"><span class="arrow">&#9664;</span>LEFT</button>
    <button class="ctlbtn" id="btnRight"><span class="arrow">&#9654;</span>RIGHT</button>
  </div>

  <div class="overlay" id="startScreen">
    <img class="logo" src="dodge-logo.png" alt="Pivot &amp; Verify — Dodge the Drift">
    <p class="sub">Move left or right to dodge what's falling. It gets faster and faster &mdash; how long can you last?</p>

    <div class="themepick" id="themepick">
      <button class="themebtn" data-theme="llm"><b>LLM Evaluation</b><span>Hallucination, data leaks, blind spots</span></button>
      <button class="themebtn" data-theme="transform"><b>AI Transformation</b><span>Resistance, silos, pilot purgatory</span></button>
    </div>

    <div class="charpick" id="charpick">
      <button class="charbtn on" data-char="a"><canvas width="88" height="128"></canvas>Pivot</button>
      <button class="charbtn" data-char="b"><canvas width="88" height="128"></canvas>Verify</button>
    </div>

    <button class="go" id="startBtn">START</button>
  </div>

  <div class="overlay" id="endScreen" hidden>
    <canvas class="result-badge" id="resultBadge" width="200" height="200"></canvas>
    <p class="result-note" id="resultNote"></p>
    <p class="result-score">Survived: <b id="finalScore">0.0s</b> &middot; Best: <b id="finalBest">0.0s</b></p>
    <a class="cta" id="ctaLink" href="#" target="_blank" rel="noopener">Read more &rarr;</a>
    <button class="go" id="againBtn">PLAY AGAIN</button>
    <button class="go2" id="menuBtn">MAIN MENU</button>
  </div>
</div>

<script>
(function(){
  // ---- Hosted asset URLs (HubSpot File Manager) ----
  // Replace these five placeholders with the URLs HubSpot gives each uploaded
  // file, then republish. Nothing else in this file needs to change.
  var CHAR_SHEET_URL      = 'dodge-characters.png';
  var BADGE_SHEET_URL     = 'dodge-badges.png';
  var MUSIC_URL           = 'dodge-bg-music.mp3';
  var SFX_GAMEOVER_URL    = 'dodge-gameover.mp3';
  var SFX_MOVE_URL        = 'dodge-move.wav';
  var SKYLINE_URL         = 'dodge-skyline.jpg';

  // Pixel rects of each sprite/badge within its sheet (sheets are packed once,
  // offline, to keep this to two image requests instead of eighteen).
  var SHEET_RECTS = {
  "characters": {
    "a_left": {
      "x": 6,
      "y": 6,
      "w": 185,
      "h": 320
    },
    "a_center": {
      "x": 197,
      "y": 6,
      "w": 217,
      "h": 320
    },
    "a_right": {
      "x": 420,
      "y": 6,
      "w": 178,
      "h": 320
    },
    "b_left": {
      "x": 604,
      "y": 6,
      "w": 190,
      "h": 320
    },
    "b_center": {
      "x": 800,
      "y": 6,
      "w": 228,
      "h": 320
    },
    "b_right": {
      "x": 1034,
      "y": 6,
      "w": 176,
      "h": 320
    }
  },
  "badges": {
    "resistance": {
      "x": 6,
      "y": 6,
      "w": 241,
      "h": 220
    },
    "pilot_purgatory": {
      "x": 307,
      "y": 6,
      "w": 265,
      "h": 220
    },
    "unclear_roi": {
      "x": 608,
      "y": 6,
      "w": 281,
      "h": 220
    },
    "silos": {
      "x": 909,
      "y": 6,
      "w": 291,
      "h": 220
    },
    "no_owner": {
      "x": 6,
      "y": 232,
      "w": 295,
      "h": 220
    },
    "never_adopted": {
      "x": 307,
      "y": 232,
      "w": 271,
      "h": 220
    },
    "hallucination": {
      "x": 608,
      "y": 232,
      "w": 242,
      "h": 220
    },
    "data_leak": {
      "x": 909,
      "y": 232,
      "w": 241,
      "h": 220
    },
    "false_positive": {
      "x": 6,
      "y": 458,
      "w": 245,
      "h": 220
    },
    "silent_drift": {
      "x": 307,
      "y": 458,
      "w": 269,
      "h": 220
    },
    "confidently_wrong": {
      "x": 608,
      "y": 458,
      "w": 283,
      "h": 220
    },
    "blind_spot": {
      "x": 909,
      "y": 458,
      "w": 250,
      "h": 220
    }
  }
};

  var charSheet = new Image();
  charSheet.onload = function(){ refreshPreviews(); };
  charSheet.src = CHAR_SHEET_URL;

  var badgeSheet = new Image();
  badgeSheet.src = BADGE_SHEET_URL;

  var bgMusic = new Audio(MUSIC_URL);
  bgMusic.loop = true;
  bgMusic.volume = 0.55;
  bgMusic.preload = 'auto';

  function startMusic(){
    try {
      var p = bgMusic.play();
      if (p && p['catch']) p['catch'](function(){
        var resume = function(){
          bgMusic.play()['catch'](function(){});
          document.removeEventListener('pointerdown', resume);
          document.removeEventListener('touchstart', resume);
          document.removeEventListener('keydown', resume);
        };
        document.addEventListener('pointerdown', resume, {once:true});
        document.addEventListener('touchstart', resume, {once:true});
        document.addEventListener('keydown', resume, {once:true});
      });
    } catch(e){}
  }
  startMusic();

  var sfxGameOver = new Audio(SFX_GAMEOVER_URL);
  sfxGameOver.volume = 0.8;
  sfxGameOver.preload = 'auto';

  var sfxMove = new Audio(SFX_MOVE_URL);
  sfxMove.volume = 0.6;
  sfxMove.preload = 'auto';

  var skylineImg = new Image();
  skylineImg.src = SKYLINE_URL;

  var THEMES = {
    llm: {
      label: 'LLM Evaluation',
      cta: { text: 'Read the LLM evaluation guide', href: 'https://brillian.fi/llm-evaluation-guide' },
      items: [
        { label:'HALLUCINATION', note:'The model stated something false with total confidence.' },
        { label:'DATA LEAK', note:'Sensitive data ended up somewhere it shouldn’t.' },
        { label:'FALSE POSITIVE', note:'A good answer got flagged as wrong.' },
        { label:'SILENT DRIFT', note:'Quality slipped, and nobody noticed.' },
        { label:'CONFIDENTLY WRONG', note:'The confidence score said 99%. The answer was still wrong.' },
        { label:'BLIND SPOT', note:'Nobody was looking at what the model actually produced.' }
      ]
    },
    transform: {
      label: 'AI Transformation',
      cta: { text: 'Read the AI transformation ebook', href: 'https://brillian.fi/ebook-building-ai-transformation' },
      items: [
        { label:'RESISTANCE', note:'The team never adopted the new way of working.' },
        { label:'PILOT PURGATORY', note:'The trial stayed a trial. Forever.' },
        { label:'UNCLEAR ROI', note:'Nobody could say what it was actually worth.' },
        { label:'SILOS', note:'Teams built the same thing without knowing it.' },
        { label:'NEVER ADOPTED', note:'It launched. Then everyone went back to the old way.' },
        { label:'NO OWNER', note:'Nobody was responsible for pushing it forward.' }
      ]
    }
  };

  var qs = new URLSearchParams(location.search);
  var deepTheme = qs.get('theme');
  if (deepTheme && !THEMES[deepTheme]) deepTheme = null;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var groundY = H * 0.80;
  var LANES = [W*0.22, W*0.5, W*0.78];

  var startScreen = document.getElementById('startScreen');
  var endScreen = document.getElementById('endScreen');
  var hud = document.getElementById('hud');
  var controls = document.getElementById('controls');
  var themepick = document.getElementById('themepick');
  var charpick = document.getElementById('charpick');
  var startBtn = document.getElementById('startBtn');
  var againBtn = document.getElementById('againBtn');
  var menuBtn = document.getElementById('menuBtn');

  var chosenTheme = deepTheme || 'llm';
  var chosenChar = 'a';

  themepick.querySelectorAll('.themebtn').forEach(function(b){
    if (b.getAttribute('data-theme') === chosenTheme) b.classList.add('on');
    b.addEventListener('click', function(){
      chosenTheme = b.getAttribute('data-theme');
      themepick.querySelectorAll('.themebtn').forEach(function(o){ o.classList.toggle('on', o===b); });
    });
  });
  charpick.querySelectorAll('.charbtn').forEach(function(b){
    b.addEventListener('click', function(){
      chosenChar = b.getAttribute('data-char');
      charpick.querySelectorAll('.charbtn').forEach(function(o){ o.classList.toggle('on', o===b); });
    });
    drawCharPreview(b.querySelector('canvas'), b.getAttribute('data-char'));
  });

  function refreshPreviews(){
    charpick.querySelectorAll('.charbtn').forEach(function(b){
      drawCharPreview(b.querySelector('canvas'), b.getAttribute('data-char'));
    });
  }

  function drawCharPreview(cv, variant){
    var c = cv.getContext('2d');
    c.clearRect(0,0,cv.width,cv.height);
    drawCharacter(c, cv.width*0.5, cv.height*0.86, 1.5, variant, 0, 0);
  }

  if (deepTheme){
    startScreen.querySelector('.themepick').style.display = 'none';
  }

  // ---------- character drawing ----------
  // lean: -1..1 (last lane-shift direction, eases back to 0). Crops the matching
  // lean-left / center / lean-right sprite out of the shared character sheet.
  var BASE_CHAR_H = 84; // reference drawn height (unscaled), matches prior proportions

  function poseForLean(lean){
    if (lean > 0.15) return 'left';
    if (lean < -0.15) return 'right';
    return 'center';
  }

  function drawCharacter(c, cx, groundYLocal, scale, variant, t, lean){
    if (!charSheet.complete || !charSheet.naturalWidth) return;
    var pose = poseForLean(lean || 0);
    var rect = SHEET_RECTS.characters[variant + '_' + pose] || SHEET_RECTS.characters[variant + '_center'];
    if (!rect) return;

    var h = BASE_CHAR_H * scale;
    var w = h * (rect.w / rect.h);
    c.save();
    c.drawImage(charSheet, rect.x, rect.y, rect.w, rect.h, cx - w / 2, groundYLocal - h, w, h);
    c.restore();
  }

  // ---------- game state ----------
  var state = 'idle'; // idle | playing | over
  var lastT;
  var elapsed, fallSpeed, lane, laneX, lean;
  var obstacles, spawnTimer, lastLabel;
  var runPhase;
  var best = {};

  function loadBest(theme){
    try { return parseFloat(localStorage.getItem('dodge_best_'+theme) || '0'); } catch(e){ return 0; }
  }
  function saveBest(theme, val){
    try { localStorage.setItem('dodge_best_'+theme, String(val)); } catch(e){}
  }

  function resetRun(){
    elapsed = 0; fallSpeed = 210; lane = 1; laneX = LANES[1]; lean = 0;
    obstacles = []; spawnTimer = 0.6; lastLabel = null; runPhase = 0;
  }

  function pickItem(theme){
    var pool = THEMES[theme].items;
    var choice, tries = 0;
    do { choice = pool[Math.floor(Math.random()*pool.length)]; tries++; }
    while (choice.label === lastLabel && tries < 6);
    lastLabel = choice.label;
    return choice;
  }

  function moveLane(dir){
    if (state !== 'playing') return;
    var next = lane + dir;
    if (next < 0 || next > 2) return;
    lane = next;
    lean = -dir;
    try { sfxMove.currentTime = 0; sfxMove.play()['catch'](function(){}); } catch(e){}
  }

  var btnLeft = document.getElementById('btnLeft');
  var btnRight = document.getElementById('btnRight');
  btnLeft.addEventListener('pointerdown', function(e){ e.preventDefault(); moveLane(-1); });
  btnRight.addEventListener('pointerdown', function(e){ e.preventDefault(); moveLane(1); });
  window.addEventListener('keydown', function(e){
    if (e.code === 'ArrowLeft'){ e.preventDefault(); moveLane(-1); }
    if (e.code === 'ArrowRight'){ e.preventDefault(); moveLane(1); }
  });

  function startGame(){
    resetRun();
    best.theme = chosenTheme;
    best.val = loadBest(chosenTheme);
    state = 'playing';
    startScreen.hidden = true; endScreen.hidden = true;
    hud.hidden = false; controls.hidden = false;
    document.getElementById('bestLive').textContent = 'best ' + best.val.toFixed(1) + 's';
    lastT = null;
    startMusic();
    requestAnimationFrame(loop);
  }
  startBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);
  menuBtn.addEventListener('click', goToMenu);

  function goToMenu(){
    state = 'idle';
    endScreen.hidden = true; startScreen.hidden = false;
    hud.hidden = true; controls.hidden = true;
    startMusic();
    idleFrame();
  }

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ try { bgMusic.pause(); } catch(e){} }
    else if (state === 'playing' || state === 'idle'){ startMusic(); }
  });

  function endGame(hitLabel, hitNote){
    state = 'over';
    controls.hidden = true; hud.hidden = true;
    try { bgMusic.pause(); } catch(e){}
    try { sfxGameOver.currentTime = 0; sfxGameOver.play()['catch'](function(){}); } catch(e){}
    var finalS = Math.round(elapsed*10)/10;
    var b = loadBest(chosenTheme);
    if (finalS > b){ b = finalS; saveBest(chosenTheme, b); }
    var badgeKey = hitLabel.toLowerCase().replace(/\s+/g, '_');
    var brect = SHEET_RECTS.badges[badgeKey];
    var bcanvas = document.getElementById('resultBadge');
    var bctx = bcanvas.getContext('2d');
    bctx.clearRect(0, 0, bcanvas.width, bcanvas.height);
    if (brect && badgeSheet.complete && badgeSheet.naturalWidth){
      var bs = Math.min(bcanvas.width / brect.w, bcanvas.height / brect.h);
      var bdw = brect.w * bs, bdh = brect.h * bs;
      bctx.drawImage(badgeSheet, brect.x, brect.y, brect.w, brect.h,
        (bcanvas.width - bdw) / 2, (bcanvas.height - bdh) / 2, bdw, bdh);
    }
    document.getElementById('resultNote').textContent = hitNote;
    document.getElementById('finalScore').textContent = finalS.toFixed(1) + 's';
    document.getElementById('finalBest').textContent = b.toFixed(1) + 's';
    var cta = THEMES[chosenTheme].cta;
    var link = document.getElementById('ctaLink');
    link.textContent = cta.text + ' →';
    link.href = cta.href;
    endScreen.hidden = false;
  }

  function drawBackground(c){
    if (skylineImg.complete && skylineImg.naturalWidth){
      var iw = skylineImg.naturalWidth, ih = skylineImg.naturalHeight;
      var s = Math.max(W / iw, H / ih);
      var dw = iw * s, dh = ih * s;
      c.drawImage(skylineImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
    } else {
      var g = c.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#131922'); g.addColorStop(1,'#1B2333');
      c.fillStyle = g; c.fillRect(0,0,W,H);
    }
  }

  function rr(c,x,y,w,h,r){
    if (c.roundRect) { c.beginPath(); c.roundRect(x,y,w,h,r); return; }
    c.beginPath(); c.rect(x,y,w,h);
  }

  function loop(ts){
    if (state !== 'playing') return;
    if (!lastT) lastT = ts;
    var dt = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts;
    if (!document.hidden) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  var BAND_TOP = -70, BAND_BOTTOM = 6; // relative to groundY: character hit-band
  var OBST_SIZE = 86, OBST_HALF = OBST_SIZE / 2; // falling badge footprint (square, contain-fit)

  function update(dt){
    runPhase += dt;
    elapsed += dt;
    fallSpeed = Math.min(760, 210 + elapsed * 16);
    laneX += (LANES[lane] - laneX) * Math.min(1, dt * 10);
    lean *= Math.max(0, 1 - dt * 6);

    spawnTimer -= dt;
    if (spawnTimer <= 0){
      var twoLanes = Math.random() < Math.min(0.45, elapsed * 0.01);
      var lanesUsed = [0,1,2].sort(function(){ return Math.random()-0.5; });
      var count = twoLanes ? 2 : 1;
      for (var k = 0; k < count; k++){
        var it = pickItem(chosenTheme);
        obstacles.push({ lane: lanesUsed[k], y: -60, label: it.label, note: it.note });
      }
      var gap = Math.max(0.55, 1.35 - elapsed * 0.012) + Math.random()*0.3;
      spawnTimer = gap;
    }

    for (var i = obstacles.length - 1; i >= 0; i--){
      var o = obstacles[i];
      o.y += fallSpeed * dt;
      var oTop = o.y - OBST_HALF, oBottom = o.y + OBST_HALF;
      var bandTop = groundY + BAND_TOP, bandBottom = groundY + BAND_BOTTOM;
      if (o.lane === lane && oBottom > bandTop && oTop < bandBottom){
        obstacles.splice(i,1);
        endGame(o.label, o.note);
        return;
      }
      if (o.y > H + 60) obstacles.splice(i,1);
    }

    document.getElementById('scoreLive').textContent = elapsed.toFixed(1) + 's';
  }

  function draw(){
    drawBackground(ctx);

    // lane guides
    ctx.strokeStyle = 'rgba(253,253,253,0.08)'; ctx.lineWidth = 1.5; ctx.setLineDash([2,10]);
    LANES.forEach(function(lx, idx){
      if (idx === 0) return;
      var bx = (LANES[idx-1]+lx)/2;
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx, groundY+20); ctx.stroke();
    });
    ctx.setLineDash([]);

    ctx.strokeStyle = 'rgba(253,253,253,0.16)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, groundY+20); ctx.lineTo(W, groundY+20); ctx.stroke();

    obstacles.forEach(function(o){
      var key = o.label.toLowerCase().replace(/\s+/g, '_');
      var rect = SHEET_RECTS.badges[key];
      if (rect && badgeSheet.complete && badgeSheet.naturalWidth){
        var scale = Math.min(OBST_SIZE / rect.w, OBST_SIZE / rect.h);
        var dw = rect.w * scale, dh = rect.h * scale;
        ctx.drawImage(badgeSheet, rect.x, rect.y, rect.w, rect.h, LANES[o.lane] - dw/2, o.y - dh/2, dw, dh);
      } else {
        var ow = 96, oh = 40;
        var ox = LANES[o.lane] - ow/2, oy = o.y - oh/2;
        ctx.fillStyle = 'rgba(255,122,101,0.16)';
        ctx.strokeStyle = '#FF7A65'; ctx.lineWidth = 2;
        rr(ctx, ox, oy, ow, oh, 8); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#FF7A65';
        ctx.font = '700 12px "JetBrains Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        wrapLabel(ctx, o.label, LANES[o.lane], o.y, ow - 12);
      }
    });

    // hit-band marker (subtle, at character's row)
    ctx.fillStyle = 'rgba(239,223,116,0.05)';
    ctx.fillRect(0, groundY + BAND_TOP, W, (BAND_BOTTOM - BAND_TOP));

    drawCharacter(ctx, laneX, groundY + 20, 1.6, chosenChar, runPhase, lean);
  }

  function wrapLabel(c, text, cx, cy, maxW){
    var words = text.split(' ');
    var lines = [], cur = '';
    words.forEach(function(w){
      var test = cur ? cur + ' ' + w : w;
      if (c.measureText(test).width > maxW && cur){ lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    var lh = 13;
    var startY = cy - (lines.length-1)*lh/2;
    lines.forEach(function(ln, i){ c.fillText(ln, cx, startY + i*lh); });
  }

  // idle preview draw
  function idleFrame(){
    if (state === 'idle'){
      drawBackground(ctx);
      ctx.strokeStyle = 'rgba(253,253,253,0.16)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, groundY+20); ctx.lineTo(W, groundY+20); ctx.stroke();
      drawCharacter(ctx, LANES[1], groundY+20, 1.6, chosenChar, performance.now()/1000, 0);
      requestAnimationFrame(idleFrame);
    }
  }
  idleFrame();

})();
</script>
